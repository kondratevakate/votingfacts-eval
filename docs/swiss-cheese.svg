<svg xmlns="http://www.w3.org/2000/svg" width="680" height="350" viewBox="0 0 680 350" role="img" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <title>Swiss cheese model of accidental election misinformation</title>
  <desc>A wrong fact passes through aligned holes in five layers (model memory, web search, synthesis, answer text, voter check) and ends in a lost vote or legal risk. VotingFacts scores only the answer produced after the first four layers.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="350" rx="12" fill="#FFFFFF"/>
  <g fill="#FAEEDA" stroke="#854F0B" stroke-width="0.75">
    <rect x="125" y="70" width="50" height="180" rx="6"/>
    <rect x="215" y="70" width="50" height="180" rx="6"/>
    <rect x="305" y="70" width="50" height="180" rx="6"/>
    <rect x="395" y="70" width="50" height="180" rx="6"/>
    <rect x="485" y="70" width="50" height="180" rx="6"/>
  </g>
  <g fill="#FFFFFF" stroke="#BA7517" stroke-width="0.75">
    <circle cx="150" cy="105" r="9"/><circle cx="150" cy="160" r="10"/><circle cx="150" cy="215" r="8"/>
    <circle cx="240" cy="120" r="8"/><circle cx="240" cy="160" r="10"/><circle cx="240" cy="225" r="9"/>
    <circle cx="330" cy="95" r="8"/><circle cx="330" cy="160" r="10"/><circle cx="330" cy="205" r="9"/>
    <circle cx="420" cy="115" r="9"/><circle cx="420" cy="160" r="10"/><circle cx="420" cy="230" r="8"/>
    <circle cx="510" cy="100" r="8"/><circle cx="510" cy="160" r="10"/><circle cx="510" cy="210" r="9"/>
  </g>
  <circle cx="70" cy="160" r="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.75"/>
  <line x1="80" y1="160" x2="552" y2="160" stroke="#D85A30" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="556" y="132" width="100" height="56" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.75"/>
  <text x="606" y="155" text-anchor="middle" font-size="14" font-weight="500" fill="#791F1F">Lost vote</text>
  <text x="606" y="173" text-anchor="middle" font-size="12" fill="#A32D2D">or legal risk</text>
  <text x="70" y="280" text-anchor="middle" font-size="12" fill="#5F5E5A">Wrong fact</text>
  <g text-anchor="middle">
    <text x="150" y="40" font-size="14" font-weight="500" fill="#2C2C2A">Model memory</text>
    <text x="150" y="57" font-size="12" fill="#5F5E5A">stale facts</text>
    <text x="240" y="280" font-size="14" font-weight="500" fill="#2C2C2A">Web search</text>
    <text x="240" y="297" font-size="12" fill="#5F5E5A">unofficial or old page</text>
    <text x="330" y="40" font-size="14" font-weight="500" fill="#2C2C2A">Synthesis</text>
    <text x="330" y="57" font-size="12" fill="#5F5E5A">applies wrong rule</text>
    <text x="420" y="280" font-size="14" font-weight="500" fill="#2C2C2A">Answer text</text>
    <text x="420" y="297" font-size="12" fill="#5F5E5A">omits must-know fact</text>
    <text x="510" y="40" font-size="14" font-weight="500" fill="#2C2C2A">Voter</text>
    <text x="510" y="57" font-size="12" fill="#5F5E5A">no official check</text>
  </g>
  <line x1="125" y1="316" x2="445" y2="316" stroke="#888780" stroke-width="0.75" stroke-dasharray="4 3"/>
  <text x="285" y="336" text-anchor="middle" font-size="12" fill="#5F5E5A">VotingFacts sees only the answer leaving these four layers</text>
</svg>
